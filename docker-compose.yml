# Qdrant สำหรับ dev — เก็บข้อมูลลง ./data/qdrant (อยู่ใน .gitignore)
#   docker compose up -d qdrant     เริ่ม
#   docker compose down             หยุด (ข้อมูลยังอยู่)
#   docker compose down -v          หยุดและลบข้อมูล
# ตรวจว่าขึ้นแล้ว: curl http://localhost:6333/readyz   ·   แผงควบคุม: http://localhost:6333/dashboard
# test ที่ต้องใช้ตัวนี้: pytest -m qdrant  (test ปกติใช้ Qdrant ในกระบวนการ ไม่ต้องมี docker)

services:
  qdrant:
    image: qdrant/qdrant:v1.16.1
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "true"
    healthcheck:
      # image ไม่มี curl — ใช้ bash เปิด TCP socket ตรง ๆ
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
